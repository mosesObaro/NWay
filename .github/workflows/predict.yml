name: Predict

# Runs on a fixed 30-minute heartbeat; `nway schedule` decides whether each
# run does any work.
#
# The schedule used to be rewritten by the job itself to match the computed
# next run time. That cannot work: GITHUB_TOKEN is forbidden from pushing
# changes to .github/workflows, and the permission is not grantable to it --
# only a personal access token or a GitHub App can do it. Every run from
# 2026-09-22 to 2026-10-09 failed on that push, which also meant the state
# file in the same commit never landed and actions/cache never saved, so each
# run rebuilt 21,000 matches from scratch and then failed.
#
# The heartbeat plus the gate gives the same behaviour without the failure
# mode. A run that is not due exits in about thirty seconds, so a quiet day
# costs ~48 short runs, and 30 minutes matches the configured tick interval
# exactly -- which the rewritten cron only ever approximated.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_tick:
        description: "Run the tick even if the schedule says it is not due"
        type: boolean
        default: false
      dry_run:
        description: "Decide and report, but send no email"
        type: boolean
        default: false

# A run rewrites shared state, so two must never overlap. Queued rather than
# cancelled: a cancelled run would leave the schedule un-advanced.
concurrency:
  group: nway-predict
  cancel-in-progress: false

permissions:
  contents: write

env:
  NWAY_FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.NWAY_FOOTBALL_DATA_ORG_TOKEN }}
  NWAY_RESEND_API_KEY: ${{ secrets.NWAY_RESEND_API_KEY }}
  NWAY_EMAIL_FROM: ${{ secrets.NWAY_EMAIL_FROM }}
  NWAY_EMAIL_TO: ${{ secrets.NWAY_EMAIL_TO }}
  NWAY_CONTACT_EMAIL: ${{ secrets.NWAY_CONTACT_EMAIL }}
  NWAY_DATABASE_URL: sqlite:///data/nway.db
  NWAY_LOG_LEVEL: INFO

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet -e .

      # Without credentials the tick can only fail. Skip it explicitly and say
      # so, rather than letting every scheduled run turn the repository red.
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          [ -z "$NWAY_FOOTBALL_DATA_ORG_TOKEN" ] && missing="$missing NWAY_FOOTBALL_DATA_ORG_TOKEN"
          [ -z "$NWAY_RESEND_API_KEY" ]         && missing="$missing NWAY_RESEND_API_KEY"
          [ -z "$NWAY_EMAIL_FROM" ]             && missing="$missing NWAY_EMAIL_FROM"
          [ -z "$NWAY_EMAIL_TO" ]               && missing="$missing NWAY_EMAIL_TO"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Secrets not configured"
              echo "Missing:$missing"
              echo ""
              echo "Add them under Settings -> Secrets and variables -> Actions."
              echo "The workflow will keep skipping until they are set."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Is this run due at all? A run that is not due stops here, in seconds,
      # which is what makes a coarse safety-net cron affordable.
      - name: Schedule gate
        id: gate
        if: steps.secrets.outputs.configured == 'true'
        run: nway schedule --gate

      - name: Not due
        if: steps.secrets.outputs.configured == 'true' && steps.gate.outputs.due != 'true' && inputs.force_tick != true
        run: |
          echo "### Not due yet" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.gate.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      # 13 MB of database plus model artefacts. Restored when present, rebuilt
      # when not -- the rebuild costs about six minutes, which is why the cache
      # matters, but nothing is lost if it is evicted.
      - name: Restore data
        if: steps.secrets.outputs.configured == 'true' && (steps.gate.outputs.due == 'true' || inputs.force_tick == true)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            data/nway.db
            data/models
            data/calibrators
          key: nway-data-v2-${{ github.run_id }}
          restore-keys: |
            nway-data-v2-

      - name: Build history and train (only on a cache miss)
        if: |
          steps.secrets.outputs.configured == 'true' &&
          (steps.gate.outputs.due == 'true' || inputs.force_tick == true) &&
          steps.cache.outputs.cache-matched-key == ''
        run: |
          nway init-db
          nway ingest --history --seasons 2017/18..current
          # The Champions League has no CSV source; its training history comes
          # from football-data.org. Without this the competition is unfitted
          # and every UCL fixture is refused.
          nway ingest --org-history --competitions champions_league
          nway train --through "$(date -u +%Y-%m-%d)"

      # The current season's statistics every run, not just on a rebuild.
      # Form features are computed from these, and a range ending at a
      # hardcoded past season leaves them months behind: on 2026-10-10 the
      # newest statistics were from May, and every candidate was rejected.
      # Seven small files, and the client skips unchanged ones via ETag.
      - name: Refresh current-season statistics
        if: steps.secrets.outputs.configured == 'true' && (steps.gate.outputs.due == 'true' || inputs.force_tick == true)
        run: nway ingest --history --seasons current

      # The ledger of what has already been emailed lives in the repository,
      # not the cache. An evicted cache then costs a rebuild rather than a
      # duplicate email.
      - name: Restore notification ledger
        if: steps.secrets.outputs.configured == 'true' && (steps.gate.outputs.due == 'true' || inputs.force_tick == true)
        run: nway schedule --restore

      - name: Ingest live fixtures and results
        if: steps.secrets.outputs.configured == 'true' && (steps.gate.outputs.due == 'true' || inputs.force_tick == true)
        run: nway ingest

      - name: Tick
        id: tick
        if: steps.secrets.outputs.configured == 'true' && (steps.gate.outputs.due == 'true' || inputs.force_tick == true)
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            nway tick --dry-run --skip-ingest | tee tick.out
          else
            nway tick --skip-ingest | tee tick.out
          fi
          {
            echo "### Tick"
            echo '```'
            cat tick.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Compute the next wake time and persist it with the ledger. This runs
      # even if the tick failed, so a transient error cannot strand the loop.
      - name: Decide the next run
        id: next
        if: always() && steps.secrets.outputs.configured == 'true' && (steps.gate.outputs.due == 'true' || inputs.force_tick == true)
        run: |
          nway schedule --write-state | tee schedule.out
          {
            echo "### Next run"
            echo '```'
            cat schedule.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the state file. GITHUB_TOKEN may not touch .github/workflows.
      #
      # continue-on-error because a lost push must not fail the job: a failed
      # job skips actions/cache's save step, which is what turned one push
      # rejection into a 7-minute rebuild on every subsequent run. The next
      # tick recomputes the schedule anyway, so a missed commit costs nothing.
      - name: Commit state
        if: always() && steps.next.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name  "nway-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/nway-state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: next run ${{ steps.next.outputs.next_run_at }} (${{ steps.next.outputs.code }})"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
