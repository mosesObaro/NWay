# Competition registry. Adding a competition is a change HERE, never in code.
#
# TRAP, verified against the live API on 2026-09-20: football-data.org uses
#   CL  = UEFA CHAMPIONS  League
#   UCL = UEFA CONFERENCE League
# Reading "UCL" as Champions League silently ingests the wrong competition.

competitions:
  domestic:
    - slug: premier_league
      name: Premier League
      country: England
      kind: DOMESTIC_LEAGUE
      structure: ROUND_ROBIN
      enabled: true
      providers:
        football_data_org: PL            # TIER_ONE (free)
        football_data_couk: E0
        openfootball: en.1
      stats_history_from: "2000/01"      # measured
      teams: 20

    - slug: la_liga
      name: La Liga
      country: Spain
      kind: DOMESTIC_LEAGUE
      structure: ROUND_ROBIN
      enabled: true
      providers:
        football_data_org: PD            # NOT "LL"
        football_data_couk: SP1
        openfootball: es.1
      stats_history_from: "2005/06"
      teams: 20

    - slug: bundesliga
      name: Bundesliga
      country: Germany
      kind: DOMESTIC_LEAGUE
      structure: ROUND_ROBIN
      enabled: true
      providers:
        football_data_org: BL1
        football_data_couk: D1
        openfootball: de.1
      stats_history_from: "2000/01"
      teams: 18

    - slug: serie_a
      name: Serie A
      country: Italy
      kind: DOMESTIC_LEAGUE
      structure: ROUND_ROBIN
      enabled: true
      providers:
        football_data_org: SA
        football_data_couk: I1
        openfootball: it.1
      stats_history_from: "2005/06"
      teams: 20

    - slug: ligue_1
      name: Ligue 1
      country: France
      kind: DOMESTIC_LEAGUE
      structure: ROUND_ROBIN
      enabled: true
      providers:
        football_data_org: FL1
        football_data_couk: F1
        openfootball: fr.1
      stats_history_from: "2010/11"      # shots from 2005/06, CORNERS only from 2010/11
      teams: 18                          # reduced from 20 in 2023/24

    - slug: eredivisie
      name: Eredivisie
      country: Netherlands
      kind: DOMESTIC_LEAGUE
      structure: ROUND_ROBIN
      enabled: true
      providers:
        football_data_org: DED
        football_data_couk: N1
        openfootball: nl.1
      stats_history_from: "2017/18"      # shallow: gates corners/cards markets
      teams: 18

    - slug: primeira_liga
      name: Primeira Liga
      country: Portugal
      kind: DOMESTIC_LEAGUE
      structure: ROUND_ROBIN
      enabled: true
      providers:
        football_data_org: PPL
        football_data_couk: P1
        openfootball: pt.1
      stats_history_from: "2017/18"      # shallow
      teams: 18

  uefa:
    - slug: champions_league
      name: UEFA Champions League
      kind: UEFA_CLUB
      structure: LEAGUE_PHASE            # league phase, then knockout
      enabled: true
      providers:
        football_data_org: CL            # Champions, not Conference
      stats_history_from: null           # no free per-match statistics
      # A UEFA competition has no form history of its own: the league phase is
      # eight matches a season and the season has only just begun. Scoping form
      # features to the competition leaves every one of them NULL, so a team's
      # form is taken from all competitions -- in practice its domestic league,
      # which is where it plays almost every week and is genuinely informative.
      feature_scope: ALL_COMPETITIONS
      # No CSV source exists for this competition, so its training history
      # comes from football-data.org instead: goals only, no shots or corners,
      # which is all the goal model needs to fit a scoring rate and a home
      # advantage. Load it with:
      #   nway ingest --org-history --competitions champions_league
      history_source: football_data_org
      history_seasons_available: 3       # free tier: 2023/24 onward; earlier 403s
      notes: >-
        Predictable. Fitted on 313 Champions League matches; held-out 2025/26
        scored log loss 0.9290 against a 1.0189 base rate, a +0.090 gain --
        stronger than five of the seven domestic leagues, because the quality
        spread in this competition is much wider. Fitting it separately matters:
        it runs at a markedly higher home advantage (+0.264) than the Premier
        League (+0.117), so pooling the domestic leagues would have been wrong.
        Clubs from outside the seven configured leagues carry thin histories and
        are filtered by the data-completeness and team-history gates; in
        practice about 55 of 126 upcoming fixtures clear them.

    - slug: europa_league
      name: UEFA Europa League
      kind: UEFA_CLUB
      structure: LEAGUE_PHASE
      enabled: false                     # blocked: football-data.org TIER_TWO (paid)
      providers:
        football_data_org: EL
      feature_scope: ALL_COMPETITIONS
      blocked_reason: >-
        Requires a paid plan on every free source checked on 2026-09-20.
        See docs/DATA_SOURCES.md section 7.

    - slug: conference_league
      name: UEFA Conference League
      kind: UEFA_CLUB
      structure: LEAGUE_PHASE
      enabled: false                     # blocked: football-data.org TIER_FOUR (paid)
      providers:
        football_data_org: UCL           # yes, UCL means CONFERENCE here
      feature_scope: ALL_COMPETITIONS
      blocked_reason: >-
        Requires a higher paid tier than the Europa League.
        See docs/DATA_SOURCES.md section 7.

  # Women's club football. Registered so the competition exists as a
  # first-class entity and can be enabled the moment a source is available.
  uefa_women:
    - slug: womens_champions_league
      name: UEFA Women's Champions League
      kind: UEFA_WOMEN_CLUB
      structure: LEAGUE_PHASE
      enabled: false
      providers: {}                      # no provider carries it
      model_scope: womens_club           # cannot share the men's club model
      blocked_reason: >-
        No source. Verified 2026-09-20: football-data.org does not list this
        competition at any tier (its only women's entry is the Women's Euro,
        a national-team tournament); football-data.co.uk publishes no women's
        divisions; openfootball has no women's repository among its 36; and
        StatsBomb's open data carries several women's leagues but not this
        competition. Separately, it could not use the existing goal model even
        with fixtures: team ratings are per-team and fitted on men's club
        sides, so every team would be unrated. It needs its own source, its own
        training history and its own trained model.

  # National-team football. A different sport as far as this system's model is
  # concerned: no squad continuity between matches, windows months apart, and
  # no overlap with the club teams the model was fitted on.
  international:
    - slug: nations_league
      name: UEFA Nations League
      kind: INTERNATIONAL
      structure: LEAGUE_PHASE
      enabled: false
      providers:
        football_data_org: UNL           # TIER_FOUR
      model_scope: international
      blocked_reason: >-
        Paid tier, and unusable by the current model even if bought. Verified
        2026-09-20: UNL is TIER_FOUR on football-data.org and a direct request
        with a free-tier token returns HTTP 403. football-data.co.uk publishes
        no international fixtures, so there is no statistics history to train
        on. Beyond access, national teams share no ratings with the club sides
        the goal model was fitted on -- every team would fall back to the
        league average -- and a team that plays roughly ten matches a year in
        windows months apart breaks the rolling-form features the system is
        built on. Enabling it needs a separate model trained on international
        results, not a configuration change.
